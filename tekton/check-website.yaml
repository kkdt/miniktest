apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-website
spec:
  params:
    - name: website
      type: string
  steps:
    - name: check
      image: alpine
      script: |
        #!/bin/sh
        echo "---------------------------------------------"
        echo "Checking service $(params.website)"
        echo "---------------------------------------------"
        echo ""
        nslookup $(params.website)
        ping -c 3 $(params.website)